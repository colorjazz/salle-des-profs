# Worker de Salle des profs 2.0 : point d'entrée unique (spécification, section 3).
# Ce Worker ne reçoit JAMAIS de clé d'AI Studio : le circuit Correction passera par Vertex à Montréal seulement.
name = "salle-des-profs"
main = "src/index.js"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

# Les pages (maquettes pour l'instant) ; le Worker ne s'exécute d'abord que pour /api/*.
[assets]
directory = "../maquettes"
run_worker_first = ["/api/*"]
not_found_handling = "404-page"

# Postgres Supabase à Montréal par Hyperdrive, cache désactivé (données personnelles).
# Créer avec : npx wrangler hyperdrive create sdp-base --connection-string="postgres://sdp_app:…@…:6543/postgres" --caching-disabled
[[hyperdrive]]
binding = "BASE"
id = "A_REMPLACER_PAR_L_ID_HYPERDRIVE"

# Limite de requêtes par compte (100 par minute).
[[ratelimits]]
name = "LIMITE"
namespace_id = "1001"
simple = { limit = 100, period = 60 }

[vars]
SUPABASE_URL = "https://A_REMPLACER.supabase.co"
ORIGINE = "https://salledesprofs.ca"

# Secrets (jamais dans ce fichier) : npx wrangler secret put SEL_IP
